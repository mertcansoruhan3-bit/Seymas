name: ZIP Dosyasını Aç

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  zip-ac:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: ZIP dosyasını aç
        run: |
          rm -rf acilan
          mkdir acilan
          unzip -o "SeymasOfis_TekProgram_v2_CariBorclu.zip" -d acilan

      - name: Proje dosyalarını yerleştir
        run: |
          shopt -s dotglob nullglob
          items=(acilan/*)

          if [ ${#items[@]} -eq 1 ] && [ -d "${items[0]}" ]; then
            cp -R "${items[0]}"/. .
          else
            cp -R acilan/. .
          fi

          rm -rf acilan
          rm -f "SeymasOfis_TekProgram_v2_CariBorclu.zip"

      - name: Değişiklikleri GitHub'a kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "ZIP dosyasını aç"
          git push
